[paths]
# Optional path to rFactor 2 installation (detected automatically if omitted).
# rf2 = C:\Program Files (x86)\Steam\steamapps\common\rFactor 2

[track]
# Scale factor per texture dimension in (0, 1].
# 1.0 keeps full resolution (default for 64-bit rF2); 0.5 halves width and height.
texture_scale=1.0

# Minimum texture size (max(width, height), inclusive) to apply texture_scale.
# 1024 scales 1024x1024 and larger; 512x512 and smaller are not scaled down.
# Also acts as a destination floor for scaled textures: max(width, height) is
# not reduced below the largest power-of-two size smaller than this threshold
# (e.g. with 1024 and texture_scale=0.25, 1024x1024 becomes 512x512, not 256x256).
# Set to 0 to scale all textures regardless of size.
texture_scale_min_size=1024

# Road surface smoothing in [0.0, 1.0] mapped to sigma in [0m, 8m].
# 0.0 disables smoothing (default); 0.5 applies moderate smoothing (sigma=4.0m) to remove
# high-frequency photogrammetry point-cloud jitter without altering macro elevation or banking.
road_smoothness=0.0

# Deterministic Blender mesh coarsening in [0.0, 1.0].
# 0.0 disables coarsening (default); 1.0 applies strongest safe coarsening.
# Reduces polygon counts on scenery and distant meshes while keeping watertight chunk
# boundaries, UV seams, and drivable road surfaces intact.
mesh_coarsening=0.0
